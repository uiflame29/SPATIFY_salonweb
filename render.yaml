services:
  - type: web
    name: spatify-backend
    env: java
    plan: free
    region: oregon
    rootDir: spatify-backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/spatify-backend-1.0.0.jar
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.vercel.app
