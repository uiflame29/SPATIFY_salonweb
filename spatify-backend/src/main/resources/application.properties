# ========== SPATIFY BACKEND CONFIGURATION ==========
server.port=${SERVER_PORT:5218}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.application.name=${APP_NAME:spatify-backend}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spatify_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:spatify-luxury-salon-jwt-secret-key-2026-very-long-and-secure-minimum-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8126,http://localhost:3000}

# Logging
logging.level.com.spatify=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# SMTP Configuration (Ethereal Email for Testing)
spring.mail.host=${MAIL_HOST:smtp.ethereal.email}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:eyt6etkeyfsj5kcq@ethereal.email}
spring.mail.password=${MAIL_PASSWORD:unncfpMPcUx5xQKt1n}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
